name: Frontend CI

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Real build contains no demo data
        run: |
          if grep -rlE "demo1234|@demo\.okul|Hakan Öztürk|Ayşe Yılmaz" dist || ls dist/assets | grep -qE "^(mert|ece|deniz|admin|teacher|student)-.*\.webp$"; then
            echo "::error::Demo data leaked into the production bundle"
            exit 1
          fi

      - run: npm run build:demo
